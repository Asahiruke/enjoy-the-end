name: Deploy Enjoy the End

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        shell: bash
        run: |
          mkdir -p dist
          cat site.part00 site.part01 site.part02 site.part03 site.part04 site.part05 | base64 -d | gunzip > dist/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path("dist/index.html")
          s=p.read_text(encoding="utf-8")
          patch=r'''
<style id="ete-mobile-focus">
@media (max-width: 720px){
  body.game-started .panel, body.game-started section, body.game-started .card { scroll-margin-top:12px; }
  body.game-started .ete-collapsed-mobile{display:none!important}
  body.game-started .ete-view-launcher{display:block!important}
}
.ete-view-launcher{display:none;margin:10px 0;padding:12px 14px;border:1px solid #555;background:#1b1b1b;color:#eee;width:100%;text-align:left}
</style>
<script id="ete-appearance-and-mobile-patch">
(function(){
 const norm=t=>(t||"").replace(/\s+/g,"").replace(/[：:]/g,"");
 function labels(){
   return [...document.querySelectorAll("label,h1,h2,h3,h4,legend,div,p,span")];
 }
 function replaceText(from,to){
   for(const e of labels()){
     if(e.children.length===0 && e.textContent.includes(from)) e.textContent=e.textContent.replace(from,to);
   }
 }
 function patchCharacter(){
   replaceText("性别","外表气质");
   replaceText("体重 / 体型","体格");
   replaceText("体重/体型","体格");
   const sels=[...document.querySelectorAll("select")];
   for(const sel of sels){
     const parent=sel.parentElement;
     const txt=(parent?.previousElementSibling?.textContent||"")+" "+(parent?.textContent||"");
     if(/外表气质|性别/.test(txt)){
       const vals=["男性化","中性","女性化"];
       [...sel.options].forEach((o,i)=>{if(vals[i]){o.textContent=vals[i];o.value=vals[i]}});
     }
     if(/体格|体重/.test(txt)){
       const vals=["纤细","匀称","壮实"];
       [...sel.options].forEach((o,i)=>{if(vals[i]){o.textContent=vals[i];o.value=vals[i]}});
     }
   }
   for(const e of labels()){
     if(e.children.length===0 && /主角看起来中等[，,]?\s*体型中等/.test(e.textContent)){
       e.textContent=e.textContent.replace(/主角看起来中等[，,]?\s*体型中等[。.]?/,"镜中的人身形匀称，个子算不上特别高。");
     }
   }
 }
 function patchMobile(){
   if(innerWidth>720) return;
   const visibleWords=["房间","人物状态","状态","近期记录","最近记录"];
   const hideWords=["储备","仓库","行动","外出","制作","容器","天气预报","设置","装备"];
   const candidates=[...document.querySelectorAll("main > section, main > div, .game > section, .game > div, #game > section, #game > div")];
   for(const el of candidates){
     const title=el.querySelector("h1,h2,h3,h4")?.textContent||"";
     if(visibleWords.some(w=>title.includes(w))) continue;
     if(hideWords.some(w=>title.includes(w))){
       el.classList.add("ete-collapsed-mobile");
       const b=document.createElement("button");
       b.className="ete-view-launcher";
       b.textContent="打开「"+title.trim()+"」";
       b.onclick=()=>{el.classList.toggle("ete-collapsed-mobile");b.textContent=el.classList.contains("ete-collapsed-mobile")?"打开「"+title.trim()+"」":"收起「"+title.trim()+"」"};
       el.parentNode.insertBefore(b,el);
     }
   }
 }
 function run(){
   patchCharacter();
   if(document.querySelector("#game,.game,[data-game],main")) document.body.classList.add("game-started");
   patchMobile();
 }
 addEventListener("DOMContentLoaded",run);
 setTimeout(run,500);
})();
</script>
'''
          s=s.replace("</body>",patch+"\n</body>")
          p.write_text(s,encoding="utf-8")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
